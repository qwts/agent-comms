# Hosted diagnostic only: a loaded standard-user profile does not establish an
# interactive desktop token. Failure remains failure and is retained as evidence.
name: Windows desktop diagnostics

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Engine acceptance or finite production-connector capacity evidence'
        type: choice
        options: [engine, candidate-startup, candidate-storage, candidate-channel, candidate-compiler, capacity-supervisor, capacity-attach, capacity-sample, capacity-startup, capacity-custody, capacity-channel, capacity-connector, capacity-preflight, capacity-pilot, detached-relay-probe, relay-startup, relay-candidate-startup]
        default: engine

permissions:
  contents: read

jobs:
  windows-engine-diagnostic:
    name: Disposable Windows engine diagnostic
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the console-free Windows pipe relay
        shell: pwsh
        run: ./scripts/build-windows-relay.ps1
      # #127: test the engines with the host's checksum-verified Node tuple.
      # This is a disposable native-engine run, not a Windows host package.
      - name: Fetch released agent-bot fixture
        if: inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup' && inputs.task != 'relay-candidate-startup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-bot-identity
          ref: 19d7dfaa72cbbb259a988c55c65ac75c3425f3d0
          path: .windows-fixtures/agent-bot
          persist-credentials: false
      - name: Fetch released agent-comms fixture
        if: inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup' && inputs.task != 'relay-candidate-startup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-comms
          ref: 98a0abb1d507563655fad435bdd26b047bbc9586
          path: .windows-fixtures/agent-comms
          persist-credentials: false
      - name: Fetch exact pre-instrumentation capacity source
        if: inputs.task != 'engine' && inputs.task != 'candidate-startup' && inputs.task != 'candidate-storage' && inputs.task != 'candidate-channel' && inputs.task != 'candidate-compiler' && inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup' && inputs.task != 'relay-candidate-startup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-comms
          ref: 25dfa8362401489503f704c7322ad1314b7e6ddb
          path: .windows-fixtures/observability-old
          persist-credentials: false
      - name: Fetch exact instrumented capacity source
        if: inputs.task != 'engine' && inputs.task != 'candidate-startup' && inputs.task != 'candidate-storage' && inputs.task != 'candidate-channel' && inputs.task != 'candidate-compiler' && inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup' && inputs.task != 'relay-candidate-startup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-comms
          ref: e648d71277da72fc50c70ebcbb94c3c8f53c7cf3
          path: .windows-fixtures/observability-new
          persist-credentials: false
      - name: Fetch exact reviewed connector-stage source
        if: inputs.task == 'candidate-startup' || inputs.task == 'candidate-storage' || inputs.task == 'candidate-channel' || inputs.task == 'candidate-compiler'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-comms
          ref: cb50469ca0b6757c4ab860de582b9b140fc525a0
          path: .windows-fixtures/stale-correction
          persist-credentials: false
      - name: Fetch exact reviewed prebuilt-relay startup source
        if: inputs.task == 'relay-candidate-startup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-comms
          ref: ba75753e8e99e7c475baff9bfa139721276b5b06
          path: .windows-fixtures/relay-correction
          persist-credentials: false
      - name: Prebuild the exact reviewed relay before disposable-account acceptance
        if: inputs.task == 'relay-candidate-startup'
        timeout-minutes: 1
        shell: pwsh
        run: ./.windows-fixtures/relay-correction/scripts/build-windows-relay.ps1
      - name: Download and verify the host-selected Windows Node sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content tests/fixtures/windows-host-components.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'agent-comms-node.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'agent-comms sidecar'
          $version = $pins.node.version
          Invoke-WebRequest "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $archive -TimeoutSec 60
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $pins.node.sha256.'win-x64') { throw 'Node archive does not match the host component pin' }
          Expand-Archive $archive -DestinationPath $directory
          "AGENT_COMMS_ACCEPTANCE_NODE=$directory\node-v$version-win-x64\node.exe" >> $env:GITHUB_ENV
          "AGENT_COMMS_NODE_ARCHIVE_SHA256=$actual" >> $env:GITHUB_ENV
      - name: Exercise engines in a disposable standard-user profile
        if: inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup'
        shell: pwsh
        env:
          AGENT_COMMS_DISPOSABLE_WINDOWS: '1'
          AGENT_COMMS_ACCEPTANCE_TASK: ${{ inputs.task }}
        run: |
          ./scripts/windows-acceptance-user.ps1 -Report .windows-results/acceptance.json -Mode $env:AGENT_COMMS_ACCEPTANCE_TASK
          exit $LASTEXITCODE
      - name: Probe relay startup and private-job containment without application workload
        if: inputs.task == 'detached-relay-probe' || inputs.task == 'relay-startup'
        shell: pwsh
        env:
          AGENT_COMMS_RELAY_PROBE_MODE: ${{ inputs.task == 'detached-relay-probe' && 'detached' || 'production' }}
        run: |
          & $env:AGENT_COMMS_ACCEPTANCE_NODE --test --test-concurrency=1 tests/windows-relay-startup.test.mjs tests/windows-detached-relay-probe.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native pipe impersonation and queued-byte guards
        if: inputs.task == 'relay-startup'
        shell: pwsh
        run: |
          & $env:AGENT_COMMS_ACCEPTANCE_NODE --test tests/platform-win32-pipe-native.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish exact native-engine acceptance matrix
        if: always() && inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup'
        shell: pwsh
        run: |
          if (Test-Path .windows-results/acceptance.json) {
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content .windows-results/acceptance.json >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Retain native-engine acceptance evidence
        if: always() && inputs.task != 'detached-relay-probe' && inputs.task != 'relay-startup'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-engine-acceptance
          path: |
            .windows-results/acceptance.json
            .windows-results/capacity/capacity.json
            .windows-results/capacity/failure.json
            .windows-results/capacity/partial-run.json
            .windows-results/capacity/relay-source-approval.json
            .windows-results/capacity/relay-component-approval.json
            .windows-results/capacity/relay-source.tar
          include-hidden-files: true
          if-no-files-found: warn
