# Hosted diagnostic only: a loaded standard-user profile does not establish an
# interactive desktop token. Failure remains failure and is retained as evidence.
name: Windows desktop diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-engine-diagnostic:
    name: Disposable Windows engine diagnostic
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # #127: test the engines with the host's checksum-verified Node tuple.
      # This is a disposable native-engine run, not a Windows host package.
      - name: Fetch released agent-bot fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-bot-identity
          ref: 19d7dfaa72cbbb259a988c55c65ac75c3425f3d0
          path: .windows-fixtures/agent-bot
          persist-credentials: false
      - name: Fetch released agent-comms fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/agent-comms
          ref: 98a0abb1d507563655fad435bdd26b047bbc9586
          path: .windows-fixtures/agent-comms
          persist-credentials: false
      - name: Download and verify the host-selected Windows Node sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content tests/fixtures/windows-host-components.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'agent-comms-node.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'agent-comms sidecar'
          $version = $pins.node.version
          Invoke-WebRequest "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $archive -TimeoutSec 60
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $pins.node.sha256.'win-x64') { throw 'Node archive does not match the host component pin' }
          Expand-Archive $archive -DestinationPath $directory
          "AGENT_COMMS_ACCEPTANCE_NODE=$directory\node-v$version-win-x64\node.exe" >> $env:GITHUB_ENV
          "AGENT_COMMS_NODE_ARCHIVE_SHA256=$actual" >> $env:GITHUB_ENV
      - name: Exercise engines in a disposable standard-user profile
        shell: pwsh
        env:
          AGENT_COMMS_DISPOSABLE_WINDOWS: '1'
        run: |
          ./scripts/windows-acceptance-user.ps1 -Report .windows-results/acceptance.json
          exit $LASTEXITCODE
      - name: Publish exact native-engine acceptance matrix
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .windows-results/acceptance.json) {
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content .windows-results/acceptance.json >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Retain native-engine acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-engine-acceptance
          path: .windows-results/acceptance.json
          if-no-files-found: warn
